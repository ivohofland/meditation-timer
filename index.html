<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="A calm meditation timer. Set a duration and, if you like, a bell every few minutes. Three bells bring you back at the end." />
    <meta name="theme-color" content="#F7F4EF" />
    <title>Meditation timer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="page" id="settings-screen">
      <h1>Meditation timer</h1>
      <form id="settings" class="card">
        <label class="field">
          <span class="label">Duration</span>
          <span class="with-unit">
            <input id="duration" name="duration" type="number" inputmode="numeric" min="1" max="180" step="1" required />
            <span>minutes</span>
          </span>
        </label>
        <label class="field">
          <span class="label">Bell every</span>
          <select id="interval" name="interval">
            <option value="">Off</option>
            <option value="1">1 minute</option>
            <option value="2">2 minutes</option>
            <option value="3">3 minutes</option>
            <option value="5">5 minutes</option>
            <option value="10">10 minutes</option>
            <option value="15">15 minutes</option>
            <option value="20">20 minutes</option>
            <option value="30">30 minutes</option>
          </select>
        </label>
        <label class="check">
          <input id="start-bell" name="startBell" type="checkbox" />
          <span>Start with a bell <span class="caption" id="start-bell-note">after 20 seconds to settle in</span></span>
        </label>
        <p class="caption">Three bells to end.</p>
      </form>
      <button class="button wide" id="begin" type="submit" form="settings">Begin</button>
      <p class="notice" id="notice" role="status" hidden></p>
      <p class="footer"><span id="hint">Leave this page open while you sit.</span> Made by the people behind <a href="https://fair.yoga">fair.yoga</a>.</p>
    </main>

    <section class="running-screen" id="running-screen" hidden aria-live="off">
      <div class="clock">
        <p class="lead-in" id="lead-in" hidden>First bell in <span id="lead-in-time">0:20</span></p>
        <div class="countdown" id="countdown" role="timer">20:00</div>
        <p class="lead-in" id="paused-notice" role="status" hidden></p>
      </div>
      <button class="stop" id="stop" type="button">Stop</button>
    </section>

    <script type="module" src="/src/timer-ui.ts"></script>
  </body>
</html>
